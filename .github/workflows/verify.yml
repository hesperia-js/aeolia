name: Verify
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      base:
        type: string
        default: ""
      head:
        type: string
        default: ""
      full:
        type: boolean
        default: false
      release-pr:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    name: Format, lint, build and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      package: ${{ steps.selection.outputs.package }}
      full: ${{ steps.selection.outputs.full }}
      reactive: ${{ steps.paths.outputs.reactive }}
      contract: ${{ steps.paths.outputs.contract }}
      realm: ${{ steps.paths.outputs.realm }}
      testing: ${{ steps.paths.outputs.testing }}
      application: ${{ steps.paths.outputs.application }}
      ci: ${{ steps.paths.outputs.ci }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check repository branch name
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          AEOLIA_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          bun -e '
            import assert from "node:assert/strict";
            import { releaseVersion } from "./scripts/ci/check-release.ts";
            const branch = process.env.AEOLIA_HEAD_BRANCH;
            assert.ok(
              /^(feature|fix|work)\/.+$/.test(branch) || branch.startsWith("release/"),
              "Use feature/<name>, fix/<name>, work/<name>, or release/<VERSION> for repository branches",
            );
            if (branch.startsWith("release/")) {
              const { version } = releaseVersion(branch.slice("release/".length));
              assert.equal(version, (await Bun.file("package.json").json()).version,
                "The release branch version must match package.json");
            }
          '
      - name: Find changed paths
        id: paths
        if: ${{ !inputs.full && inputs.base != '' && inputs.head != '' }}
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ""
          base: ${{ inputs.base }}
          ref: ${{ inputs.head }}
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes
      - name: Resolve verification scope
        id: selection
        env:
          FULL: ${{ inputs.full || steps.paths.outcome != 'success' || steps.paths.outputs.all_count == '' || steps.paths.outputs.all_count == '0' || steps.paths.outputs.full != 'false' }}
          PACKAGE: ${{ steps.paths.outputs.package == 'true' }}
        shell: bash
        run: |
          if [ "$FULL" = true ]; then PACKAGE=true; fi
          printf 'full=%s\npackage=%s\n' "$FULL" "$PACKAGE" >> "$GITHUB_OUTPUT"
      - name: Check format
        run: bun run fmt:check
      - name: Check lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Check types
        run: bun run typecheck
      - name: Check release version
        if: inputs.release-pr
        env:
          AEOLIA_RELEASE_BASE: ${{ inputs.base }}
        run: bun scripts/ci/check-release.ts
      - name: Check built exports
        if: steps.selection.outputs.package == 'true'
        run: bun test tests/package
      - name: Pack candidate
        if: steps.selection.outputs.package == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aeolia-package"
          bun pm pack --filename "$RUNNER_TEMP/aeolia-package/aeolia.tgz"
      - name: Save candidate
        if: steps.selection.outputs.package == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: aeolia-package
          path: ${{ runner.temp }}/aeolia-package/aeolia.tgz
          overwrite: true
          if-no-files-found: error
          retention-days: 14
  tests:
    name: Tests (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run full behavioral suite
        if: needs.checks.outputs.full == 'true'
        run: bun test tests/reactive tests/contract tests/realm tests/testing tests/application tests/ci --coverage --coverage-reporter=lcov --coverage-reporter=text
      - name: Require 90% line and function coverage
        if: needs.checks.outputs.full == 'true'
        run: bun scripts/ci/coverage.ts
      - name: Test reactive behavior
        if: needs.checks.outputs.full == 'false' && needs.checks.outputs.reactive == 'true'
        run: bun test tests/reactive
      - name: Test contract behavior
        if: needs.checks.outputs.full == 'false' && needs.checks.outputs.contract == 'true'
        run: bun test tests/contract
      - name: Test realm behavior
        if: needs.checks.outputs.full == 'false' && needs.checks.outputs.realm == 'true'
        run: bun test tests/realm
      - name: Test testing helpers
        if: needs.checks.outputs.full == 'false' && needs.checks.outputs.testing == 'true'
        run: bun test tests/testing
      - name: Test application behavior
        if: needs.checks.outputs.full == 'false' && needs.checks.outputs.application == 'true'
        run: bun test tests/application
      - name: Test CI policies
        if: needs.checks.outputs.full == 'false' && needs.checks.outputs.ci == 'true'
        run: bun test tests/ci
      - name: Download candidate
        if: needs.checks.outputs.package == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: aeolia-package
          path: ${{ runner.temp }}/aeolia-package
      - name: Install Chromium system dependencies
        if: needs.checks.outputs.package == 'true' && runner.os == 'Linux'
        run: bunx --no-install playwright install-deps chromium
      - name: Provision Chrome for Testing
        id: chrome
        if: needs.checks.outputs.package == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Google lists .50/.51 as the security release; .78 is a later Stable build.
          # https://chromereleases.googleblog.com/2026/11/stable-channel-update-for-desktop_018223192.html
          $version = "157.0.8103.78"
          if ($env:RUNNER_ARCH -ne "X64") { throw "Unsupported Chrome for Testing architecture" }
          if ($env:RUNNER_OS -eq "Linux") {
            $platform = "linux64"
            $relativeExecutable = "chrome-linux64/chrome"
          } elseif ($env:RUNNER_OS -eq "Windows") {
            $platform = "win64"
            $relativeExecutable = "chrome-win64/chrome.exe"
          } else {
            throw "Unsupported Chrome for Testing platform"
          }
          $url = "https://storage.googleapis.com/chrome-for-testing-public/$version/$platform/chrome-$platform.zip"
          $destination = Join-Path $env:RUNNER_TEMP "aeolia-cft-$version"
          if (Test-Path -LiteralPath $destination) { throw "Chrome destination already exists" }
          New-Item -ItemType Directory -Path $destination | Out-Null
          $archive = Join-Path $destination "chrome.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 0
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($env:RUNNER_OS -eq "Linux") {
            & unzip -q $archive -d $destination
            if ($LASTEXITCODE -ne 0) { throw "Chrome archive extraction failed" }
          } else {
            Expand-Archive -LiteralPath $archive -DestinationPath $destination
          }
          $executable = Get-Item -LiteralPath (Join-Path $destination $relativeExecutable)
          if ($executable -isnot [System.IO.FileInfo] -or $executable.LinkType) {
            throw "Chrome executable must be a regular file"
          }
          if (-not [System.IO.Path]::IsPathFullyQualified($executable.FullName)) {
            throw "Chrome executable path must be absolute"
          }
          if ($env:RUNNER_OS -eq "Linux") {
            $reported = (& $executable.FullName --version) -join ""
            if ($LASTEXITCODE -ne 0) { throw "Chrome version check failed" }
            $match = [regex]::Match($reported, '^Google Chrome for Testing (\d+\.\d+\.\d+\.\d+)$')
            if (-not $match.Success) { throw "Unexpected Chrome version output: $reported" }
            $actualVersion = $match.Groups[1].Value
          } else {
            $info = $executable.VersionInfo
            $actualVersion = "$($info.ProductMajorPart).$($info.ProductMinorPart).$($info.ProductBuildPart).$($info.ProductPrivatePart)"
          }
          if ($actualVersion -ne $version) { throw "Unexpected Chrome version: $actualVersion" }
          $executableHash = (Get-FileHash -LiteralPath $executable.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "Chrome for Testing URL: $url"
          Write-Output "Observed archive SHA-256: $archiveHash"
          Write-Output "Chrome executable: $($executable.FullName)"
          Write-Output "Observed executable SHA-256: $executableHash"
          Write-Output "Executable version: $actualVersion"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$($executable.FullName)" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8
      - name: Test installed candidate
        if: needs.checks.outputs.package == 'true'
        env:
          AEOLIA_ARCHIVE: ${{ runner.temp }}/aeolia-package/aeolia.tgz
          AEOLIA_CHROME_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
          AEOLIA_CHROME_EXPECTED_VERSION: ${{ steps.chrome.outputs.version }}
        shell: bash
        run: bun tests/package/run.ts "$AEOLIA_ARCHIVE"
      - name: Save coverage
        if: always() && needs.checks.outputs.full == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          overwrite: true
          if-no-files-found: warn
          retention-days: 14
  result:
    name: Verification result
    if: always()
    needs: [checks, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require checks and both test jobs
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
        run: test "$CHECKS" = success && test "$TESTS" = success
